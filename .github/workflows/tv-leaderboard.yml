name: TV Leaderboard Readability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enlarge-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add TV leaderboard sizing override
        shell: python
        run: |
          from pathlib import Path

          p = Path('apc-office-sync.js')
          s = p.read_text(encoding='utf-8')
          original = s

          marker = 'document.head.appendChild(style);'
          override = '''document.head.appendChild(style);\n    // TV DISPLAY OVERRIDE: make the live leaderboard easy to read from a distance.\n    if (!document.getElementById('apc-tv-readable-style')) {\n      const tvStyle = document.createElement('style');\n      tvStyle.id = 'apc-tv-readable-style';\n      tvStyle.textContent = `\n        #apcLivePanel { width: 720px !important; }\n        #apcLivePanel .apc-head { padding: 20px 22px 16px !important; }\n        #apcLivePanel .apc-title { font-size: 24px !important; }\n        #apcLivePanel .apc-tabs { gap: 8px !important; padding: 12px 16px !important; }\n        #apcLivePanel .apc-tab { padding: 10px 8px !important; font-size: 11px !important; }\n        #apcLivePanel .apc-kpis { gap: 12px !important; padding: 16px 18px !important; }\n        #apcLivePanel .apc-kpi { padding: 16px 10px !important; }\n        #apcLivePanel .apc-kpi b { font-size: 34px !important; }\n        #apcLivePanel .apc-kpi span { font-size: 13px !important; }\n        #apcLivePanel .apc-date { padding: 4px 18px 12px !important; font-size: 13px !important; }\n        #apcLivePanel .apc-list { padding: 0 16px 18px !important; max-height: 680px !important; }\n        #apcLivePanel .apc-row { grid-template-columns: 58px 1fr 90px 108px !important; gap: 12px !important; padding: 15px 10px !important; }\n        #apcLivePanel .apc-rank { font-size: 24px !important; }\n        #apcLivePanel .apc-name { font-size: 21px !important; }\n        #apcLivePanel .apc-st { margin-top: 5px !important; font-size: 13px !important; }\n        #apcLivePanel .apc-num { font-size: 18px !important; }\n        #apcLivePanel .apc-num small { font-size: 12px !important; }\n        @media (max-width: 760px) {\n          #apcLivePanel { width: calc(100vw - 24px) !important; }\n        }\n      `;\n      document.head.appendChild(tvStyle);\n    }'''

          if 'apc-tv-readable-style' not in s:
              if marker not in s:
                  raise SystemExit('leaderboard style marker not found')
              s = s.replace(marker, override, 1)

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('TV readability override added.')
          else:
              print('TV readability override already present.')

      - name: Commit changes if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apc-office-sync.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Make live performance leaderboard TV readable"
          git push
