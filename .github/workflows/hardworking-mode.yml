name: Office Display Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish-office-display:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore movement, station safety, and enlarge TV leaderboard
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove the temporary hardworking flag from agent creation.
          s = s.replace("      breakKind: null,\n      hardworking: true\n    };", "      breakKind: null\n    };", 1)

          # Remove the temporary HARDWORKING MODE guard from the regular agent update.
          hard_agent = re.compile(
              r"\n    // HARDWORKING MODE: keep every employee at their workstation\.\n"
              r"    // Breaks, away trips, meetings, stretches, chats and simulated\n"
              r"    // offline states are disabled for the current office presentation\.\n"
              r"    if \(a\.hardworking\) \{.*?\n      return;\n    \}\n",
              re.S,
          )
          s, _ = hard_agent.subn("\n", s, count=1)

          # Remove the temporary HARDWORKING MODE guard from the CEO update.
          hard_ceo = re.compile(
              r"\n    if \(a\.hardworking\) \{\n"
              r"      a\.path = null;\n"
              r"      a\.lerp = null;\n"
              r"      a\.bubbleT = 0;\n"
              r"      a\.bubbleMsg = null;\n"
              r"      a\.state = 'WORKING';\n"
              r"      a\.sitting = true;\n"
              r"      a\.facing = a\.seat\.facing;\n"
              r"      return;\n"
              r"    \}\n",
              re.S,
          )
          s, _ = hard_ceo.subn("\n", s, count=1)

          # Safety net: a WORKING agent that is no longer moving and no longer
          # sitting must always navigate back to the assigned station.
          marker = "    if (a.fading) {"
          safety = (
              "    // STATION SAFETY: never leave a working employee stranded on the floor.\n"
              "    // Once movement finishes, send them back to their assigned station and seat.\n"
              "    if (a.visible && a.state === 'WORKING' && !a.sitting && !a.path && !a.lerp) {\n"
              "      goSitAtDesk(a);\n"
              "      return;\n"
              "    }\n\n"
          )
          if "// STATION SAFETY: never leave a working employee stranded" not in s:
              if marker not in s:
                  raise SystemExit('agent fading marker not found')
              s = s.replace(marker, safety + marker, 1)

          # CEO safety: keep the executive anchored to its assigned station when working.
          ceo_marker = "    /* occasional executive pronouncements from the corner office */"
          ceo_safety = (
              "    // STATION SAFETY: keep the CEO anchored to the assigned station when working.\n"
              "    if (a.state === 'WORKING' && !a.sitting && !a.path && !a.lerp) {\n"
              "      a.sitting = true;\n"
              "      a.pos.x = a.seat.x;\n"
              "      a.pos.y = a.seat.y;\n"
              "      a.facing = a.seat.facing;\n"
              "    }\n"
          )
          if "// STATION SAFETY: keep the CEO anchored" not in s:
              if ceo_marker not in s:
                  raise SystemExit('CEO pronouncement marker not found')
              s = s.replace(ceo_marker, ceo_safety + ceo_marker, 1)

          if s == original:
              print('No index.html changes needed.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Patched index.html successfully.')

      - name: Enlarge live performance leaderboard for TV readability
        shell: python
        run: |
          from pathlib import Path

          p = Path('apc-office-sync.js')
          s = p.read_text(encoding='utf-8')
          original = s

          replacements = {
              'width:500px;max-width:calc(100vw - 28px);max-height:calc(100% - 28px)': 'width:720px;max-width:calc(100vw - 28px);max-height:calc(100% - 28px)',
              'padding:16px 18px 12px': 'padding:20px 22px 16px',
              'font-size:18px;font-weight:900;letter-spacing:2px': 'font-size:24px;font-weight:900;letter-spacing:2px',
              'gap:6px;padding:10px 14px': 'gap:8px;padding:12px 16px',
              'padding:8px 6px;font:800 9px/1.1': 'padding:10px 8px;font:900 11px/1.1',
              'gap:10px;padding:12px 8px': 'gap:12px;padding:15px 10px',
              'grid-template-columns:46px 1fr 68px 82px': 'grid-template-columns:58px 1fr 90px 108px',
              'font-size:18px;font-weight:900;text-align:center': 'font-size:24px;font-weight:900;text-align:center',
              'font-size:16px;font-weight:900': 'font-size:21px;font-weight:900',
              'margin-top:4px;font-size:11px;font-weight:800': 'margin-top:5px;font-size:13px;font-weight:800',
              'font-size:14px;font-weight:900': 'font-size:18px;font-weight:900',
              'font-size:10px': 'font-size:12px',
              'padding:12px 14px': 'padding:16px 18px',
              'font-size:28px;line-height:1.05': 'font-size:34px;line-height:1.05',
              'margin-top:5px;color:#8b94a7;font-size:11px': 'margin-top:6px;color:#8b94a7;font-size:13px',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          # Keep the mobile layout compact while making desktop/TV display substantially larger.
          s = s.replace('@media(max-width:760px){#apcLivePanel{width:calc(100vw - 24px);right:12px;top:12px}', '@media(max-width:760px){#apcLivePanel{width:calc(100vw - 24px);right:12px;top:12px}')

          if s != original:
              p.write_text(s, encoding='utf-8')
              print('Patched apc-office-sync.js successfully.')
          else:
              print('No apc-office-sync.js changes needed.')

      - name: Commit changes if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apc-office-sync.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Enlarge live performance center for TV readability"
          git push
